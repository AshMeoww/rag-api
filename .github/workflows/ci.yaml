name: RAG CI Pipeline

on:
  push:
    paths:
      - 'docs/**'       # Changed from 'k8s.txt'
      - 'app.py'
      - 'embed_docs.py' # Changed from 'embed.py'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn chromadb requests

      - name: Rebuild embeddings
        run: python embed_docs.py  # Changed from embed.py

      - name: Start API in mock mode
        run: |
          USE_MOCK_LLM=1 uvicorn app:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for API to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/docs > /dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API failed to start within 60s"
              exit 1
            fi
            echo "Attempt $i: not ready yet..."
            sleep 2
          done

      - name: Run semantic tests
        run: python semantic_test.py

      - name: Success
        run: echo "✅ All tests passed! RAG quality maintained."
